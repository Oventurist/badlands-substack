name: Deploy VitePress site to Pages

on:
  # Runs on pushes to main (the hourly wiki sync auto-commit triggers this)
  push:
    branches: [main]
  # Allows manual run from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time (parallel 10K-page builds would OOM the runner).
# NOTE: cancel-in-progress MUST be false — with hourly wiki pushes and
# ~45-min builds, canceling the in-progress run on each new push means a
# build never finishes (every push kills the previous one). Queued builds
# run serially instead; each deploys when done, and the last one carries
# the newest wiki state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # 16 GB / 8-core runner: the standard 7 GB runner OOMs on 10K-page
    # builds even with NODE_OPTIONS raised (6GB heap + OS = 7GB ceiling).
    # Larger runners cost 3x Actions minutes, but public repos have
    # unlimited minutes — so this is free.
    runs-on: ubuntu-latest-8core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # generates site/docs from wiki/, then renders the VitePress site.
        # NODE_OPTIONS raises the JS heap cap: the default ~4GB dies on
        # 8K+ page builds (FATAL ERROR: JavaScript heap out of memory).
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload the built VitePress output
          path: site/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
