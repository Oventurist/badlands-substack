name: Deploy static site to Pages

on:
  # Runs on pushes to main (the hourly wiki sync auto-commit triggers this)
  push:
    branches: [main]
  # Allows manual run from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time (parallel 10K-page builds would thrash the runner).
# NOTE: cancel-in-progress MUST be false — with hourly wiki pushes and
# ~1-min builds, canceling the in-progress run on each new push means a
# build never finishes. Queued builds run serially; each deploys when done.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Generate static site
        working-directory: site
        # Lightweight static generator: markdown -> HTML + shared CSS/JS.
        # Emits ~75MB total (vs the 1.4GB+ VitePress SPA build that exceeded
        # GitHub Pages' 1GB limit and made deploys time out).
        run: node scripts/generate-site.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Small artifact (~75MB) activates quickly; 45min is belt-and-braces.
          timeout: 45
