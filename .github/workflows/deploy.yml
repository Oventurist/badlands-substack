name: Deploy VitePress site to Pages

on:
  # Runs on pushes to main (the hourly wiki sync auto-commit triggers this)
  push:
    branches: [main]
  # Allows manual run from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time (parallel 10K-page builds would OOM the runner).
# NOTE: cancel-in-progress MUST be false — with hourly wiki pushes and
# ~45-min builds, canceling the in-progress run on each new push means a
# build never finishes (every push kills the previous one). Queued builds
# run serially instead; each deploys when done, and the last one carries
# the newest wiki state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Standard runner. The 10K-page OOM was the inlined sidebar payload
    # (removed — config is now 4KB); NODE_OPTIONS 6GB heap is belt-and-
    # braces. Larger runners cost 3x minutes and need plan support.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        # generates site/docs from wiki/, then renders the VitePress site.
        # NODE_OPTIONS raises the JS heap cap: the default ~4GB dies on
        # 11K+ page builds. The 6GB heap is borderline on GitHub's 7GB
        # runners (runner-to-runner variance — identical commits sometimes
        # OOM at the final bundling phase), so retry up to 3x; a retry
        # lands on a different runner and usually completes.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          for attempt in 1 2 3; do
            echo "=== build attempt $attempt ==="
            if npm run build; then
              echo "build succeeded on attempt $attempt"
              exit 0
            fi
            echo "build failed on attempt $attempt (exit $?) — retrying"
            sleep 10
          done
          echo "build failed after 3 attempts"
          exit 1

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload the built VitePress output
          path: site/docs/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
