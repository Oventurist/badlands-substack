name: Deploy VitePress site to Pages

on:
  # Runs on pushes to main (the hourly wiki sync auto-commit triggers this)
  push:
    branches: [main]
  # Allows manual run from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one build at a time (parallel 10K-page builds would OOM the runner).
# NOTE: cancel-in-progress MUST be false — with hourly wiki pushes and
# ~45-min builds, canceling the in-progress run on each new push means a
# build never finishes (every push kills the previous one). Queued builds
# run serially instead; each deploys when done, and the last one carries
# the newest wiki state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Standard runner. The 10K-page OOM was the inlined sidebar payload
    # (removed — config is now 4KB); NODE_OPTIONS 6GB heap is belt-and-
    # braces. Larger runners cost 3x minutes and need plan support.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build (split into entities + concepts halves)
        working-directory: site
        # The full 11.5K-page build OOMs GitHub's 7GB runner (6GB heap fits
        # ~11K pages, not 11.5K). Build the two halves separately (each
        # ~5.8K pages, well under the limit) and merge the dists. Both
        # halves render the same theme/nav, so the merged site is complete.
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          set -e
          echo "=== generate site (once) ==="
          node scripts/generate-site.mjs

          echo "=== build entities half ==="
          mv docs/concepts docs/concepts.hidden
          npx vitepress build docs --outDir dist-entities
          mv docs/concepts.hidden docs/concepts

          echo "=== build concepts half ==="
          mv docs/entities docs/entities.hidden
          npx vitepress build docs --outDir dist-concepts
          mv docs/entities.hidden docs/entities

          echo "=== merge halves ==="
          mkdir -p dist-final
          cp -r dist-concepts/. dist-final/
          cp -r dist-entities/. dist-final/
          echo "merged $(find dist-final -name '*.html' | wc -l) html pages"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # upload the merged (entities + concepts) VitePress output
          path: site/dist-final

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
